# Local reference only. This file is never deployed and never read at runtime.
# These values are mirrored in code as the shipped defaults for every user.
# Runtime Mjolnir settings: BepInEx/config/odin.valala.raja.mods.mjolnir.cfg
# Runtime HUD margins:     BepInEx/config/odin.valala.raja.mods.cfg [Mjolnir HUD]
#
# Keep only the keys that differ from default.cfg, with their local values.

[Presentation]
CustomModelFlip = false

# Bigger, more visible thrown-hammer craters.
[TerrainImpact]
CratersEnabled = true
MaximumRadius = 10
MaximumDepth = 6
DistanceForMaximumContribution = 250
FallAltitudeForMaximumContribution = 40

# Harder direct throw.
[Throwing]
ImpactDamage = 250

# Valala's own impact layer, stored in odin.valala.raja.mods.cfg.
[Mjolnir Impact]
Enabled = true
LightningVfx = true
Damage = true
Radius = 8
DamageAmount = 250
MinImpactSpeed = 8
DamageStructures = true
DamagePlayerStructures = true
Cooldown = 0.4

# HUD, stored in odin.valala.raja.mods.cfg.
[Mjolnir HUD]
RightMargin = 12
BottomMargin = 72

# Mjolnir F4 menu guard, stored in odin.valala.raja.mods.cfg.
[Mjolnir Menu]
Enabled = false
OpenKey = LeftControl + LeftAlt + F10
