DistantThunderRange = 600

[Worthiness]

## Local worthiness policy. Living is the current system: worthiness is earned and lost by what you do. Every other mode is the superseded fixed-value behaviour, kept so an existing world can be put back the way it was.
# Setting type: WorthinessMode
# Default value: Living
# Acceptable values: Disabled, EveryoneWorthy, OwnerOnly, ProgressionBased, CustomProviders, Living
Mode = Living

## Treat the local player as fully worthy and unlock every tier-gated power. Deeds continue raising or lowering saved worthiness while access requirements are bypassed. Toggled in the in-game settings menu.
# Setting type: Boolean
# Default value: false
BypassWorthinessProgression = false

## Bind an unowned hammer to the first local character who equips it.
# Setting type: Boolean
# Default value: true
BindOnFirstEquip = true

[WorthinessDamage]

## Scale generic, blunt, slash, and pierce combat damage; gathering damage is excluded.
# Setting type: Boolean
# Default value: true
AffectPhysical = true

## Scale fire, frost, poison, and spirit damage.
# Setting type: Boolean
# Default value: true
AffectElemental = true

## Scale lightning separately from other elemental damage.
# Setting type: Boolean
# Default value: true
AffectLightning = true

## Use the unarmed category for all damage in unarmed hits.
# Setting type: Boolean
# Default value: true
AffectUnarmed = true

## Use the Mjolnir category for melee, throws, recalls, lightning, and slams.
# Setting type: Boolean
# Default value: true
AffectMjolnir = true

## Apply explicit throw, lightning, and slam bonuses to structures; disabled by default to preserve progression and reinforced resistance.
# Setting type: Boolean
# Default value: false
AffectMjolnirStructures = false

## Share of the curve bonus applied to ordinary physical damage.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 1
PhysicalScale = 0.8

## Share of the curve bonus applied to ordinary non-lightning elemental damage.
# Setting type: Single
# Default value: 0.65
# Acceptable value range: From 0 to 1
ElementalScale = 0.65

## Share of the curve bonus applied to ordinary lightning damage.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
LightningScale = 1

## Share of the curve bonus applied to unarmed hits.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 1
UnarmedScale = 0.6

## Share of the curve bonus applied to all Mjolnir-authored damage.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
MjolnirScale = 1

[WorthinessLedger]

## Worthiness a character begins with. The shipped 12 sits above the unworthy threshold and below the first tier: Mjolnir permits you to carry it and grants you nothing.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 0 to 100
StartingWorthiness = 12

## Lowest worthiness the ledger will fall to. Zero lets a wielder be judged all the way out of the hammer; every deed that raises worthiness can be done bare-handed, so the way back stays open.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
Floor = 0

## Share of a gain that still lands at full worthiness. Losses always land whole. 1 restores the old ratchet where the top tier, once reached, could not be lost.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 1
HighWorthinessResistance = 0.3

## Worthiness for letting a wounded creature that broke and ran get away.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From -25 to 25
SparedFleeingFoe = 0.25

## Worthiness for killing a creature that had already broken and run.
# Setting type: Single
# Default value: -0.3
# Acceptable value range: From -25 to 25
StruckFleeingFoe = -0.3

## Worthiness for putting down something well above your own weight.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From -25 to 25
DefeatedStrongerFoe = 1.5

## Worthiness for killing a tame or another player. Hunting wild animals for food is not judged here.
# Setting type: Single
# Default value: -2.5
# Acceptable value range: From -25 to 25
StruckHelplessCreature = -2.5

## Worthiness for killing something far beneath you. A rounding error by default: routine kills are neither a path to Thor nor, on their own, a fall from him.
# Setting type: Single
# Default value: -0.05
# Acceptable value range: From -25 to 25
PunchedDown = -0.05

## Worthiness for winning a fight from the edge of death rather than from safety.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -25 to 25
HeldTheLine = 1

## Worthiness for taking a blow meant for a tame or another player.
# Setting type: Single
# Default value: 3
# Acceptable value range: From -25 to 25
ShieldedAnother = 3

## Worthiness for dying while flying, diving, or otherwise mid-power.
# Setting type: Single
# Default value: -6
# Acceptable value range: From -25 to 25
DiedInHubris = -6

## Worthiness for dying on foot with the fight joined. Small and forgiving: the first death in a while lands at a fraction of this, and only repeats climb to the full cost.
# Setting type: Single
# Default value: -0.75
# Acceptable value range: From -25 to 25
DiedFighting = -0.75

## Worthiness for felling one of the forsaken.
# Setting type: Single
# Default value: 10
# Acceptable value range: From -25 to 25
FelledAGuardian = 10

## Name each deed as it is judged, with the direction worthiness moved. Turning this off makes the living ledger invisible, which will read as random nerfs.
# Setting type: Boolean
# Default value: true
ShowDeedNotifications = true

## Shortest gap between two deed messages. A crowded fight can judge several deeds at once; without a gap they overwrite each other unread.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 10
NotificationSpacingSeconds = 1.5

## How much of your own maximum health a creature must have before defeating it counts as beating something stronger. Lower than before so worthwhile fights keep counting as you out-gear a biome, rather than the gain flow drying up the moment nothing is far above your weight.
# Setting type: Single
# Default value: 1.35
# Acceptable value range: From 1 to 6
StrongerFoeHealthRatio = 1.35

## The share of your own maximum health below which a kill counts as punching down.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0.01 to 1
WeakerFoeHealthRatio = 0.2

## The share of your own maximum health below which surviving a kill counts as holding the line.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0.01 to 1
HeldTheLineHealthRatio = 0.25

## How long a creature you wounded must stay alive and fled before letting it go counts as mercy.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 2 to 60
SparedFleeingSeconds = 12

## How long after a creature breaks and runs your blows still count as finishing the fight rather than chasing it down. A swing already in flight when the creature turns is not a chase. Zero restores the previous behaviour, where crossing the flee threshold mid-animation was judged as one.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 15
FleeGraceSeconds = 2

## Share of its weight the first death costs, whether on foot or mid-power. Repeats of the same kind inside the window climb back to the full weight. 1 restores the flat cost, where a single accident at the top tier undid about ten hard-won kills.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0.01 to 1
RepeatedLossFirstShare = 0.25

## What each repeat inside the window multiplies the cost by.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 8
RepeatedLossGrowth = 2

## How long a streak of repeated deaths of the same kind is remembered. Past this, the next one is a first death again.
# Setting type: Single
# Default value: 600
# Acceptable value range: From 0 to 3600
RepeatedLossWindowSeconds = 600

[WorthinessLightning]

## Scale every bolt Mjolnir calls by how worthy its wielder is, in damage and in how the arc is drawn. Off restores lightning that is identical at every worthiness, gated only by tier.
# Setting type: Boolean
# Default value: true
Enabled = true

## Share of a bolt's authored damage an unworthy wielder calls. Rises to the full authored damage at 100 worthiness, and no further: the WorthinessScaling damage bonus is what pays the worthy beyond that.
# Setting type: Single
# Default value: 0.33
# Acceptable value range: From 0.05 to 1
MinimumDamageShare = 0.33

## How thick an unworthy wielder's arcs are drawn, relative to the authored width.
# Setting type: Single
# Default value: 0.45
# Acceptable value range: From 0.05 to 4
MinimumVisualScale = 0.45

## How thick a fully worthy wielder's arcs are drawn. Above 1 on purpose: a wider arc costs nothing in balance and is the only part of this the player can actually see.
# Setting type: Single
# Default value: 1.55
# Acceptable value range: From 0.05 to 4
MaximumVisualScale = 1.55

## Shape of the climb between the two ends. Below 1 puts most of the visible change in the early tiers, where a wielder is still deciding whether the system is worth engaging with.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0.1 to 4
CurveExponent = 0.75

